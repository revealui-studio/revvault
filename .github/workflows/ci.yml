name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"

jobs:
  # GAP-372: materialized .claude rules must match .revcon-manifest.json
  copy-lockstep:
    name: Copy lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify copy-mode lockstep
        run: bash scripts/verify-copy-lockstep.sh --target "$GITHUB_WORKSPACE"

  test:
    # NOTE: job name preserved as "Test (core + cli)" to match the required
    # status check registered with branch protection. To rename safely,
    # update the branch-protection rule first (Settings → Branches → main).
    name: Test (core + cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The Tauri desktop crate (`revvault-tauri`) is excluded because it
      # requires libwebkit2gtk-4.1-dev + libgtk-3-dev and ships through a
      # separate release pipeline.
      - name: cargo test -p revvault-core -p revvault-cli --all-targets
        run: cargo test -p revvault-core -p revvault-cli --all-targets

  native-service-custody:
    name: Native service custody, replacement and independent restore
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build maintained disposable fixture
        run: docker build -f crates/core/tests/service-provisioning.Dockerfile -t revealfleet-vault-native-tests .
      - name: Prepare synthetic custody and verify replacement
        shell: bash
        run: |
          set -euo pipefail
          volume="revealfleet-custody-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          recovery_volume="revealfleet-recovery-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          authority_volume="revealfleet-recovery-authority-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          restore_volume="revealfleet-restored-custody-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$volume" >/dev/null
          trap 'docker volume rm "$volume" "$recovery_volume" "$authority_volume" "$restore_volume" >/dev/null' EXIT
          docker volume create "$recovery_volume" >/dev/null
          docker volume create "$authority_volume" >/dev/null
          docker volume create "$restore_volume" >/dev/null
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 256 --mount "type=volume,src=$volume,dst=/var/lib/revvault" --mount "type=volume,src=$recovery_volume,dst=/root/revealfleet-backup-proof" --mount "type=volume,src=$authority_volume,dst=/root/revealfleet-recovery-authority" revealfleet-vault-native-tests
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 256 --mount "type=volume,src=$volume,dst=/var/lib/revvault" --env REVEALFLEET_NATIVE_SERVICE_REPLACEMENT=1 revealfleet-vault-native-tests
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 256 --mount "type=volume,src=$restore_volume,dst=/var/lib/revvault" --mount "type=volume,src=$recovery_volume,dst=/root/revealfleet-backup-proof,readonly" --mount "type=volume,src=$authority_volume,dst=/root/revealfleet-recovery-authority,readonly" --env REVEALFLEET_NATIVE_SERVICE_RESTORE=1 revealfleet-vault-native-tests

  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - name: cargo fmt --check --all
        run: cargo fmt --check --all

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Workspace clippy would pull in revvault-tauri whose deps need gtk;
      # mirror the test job's scope and lint core + cli only. Matches the
      # standard set in scripts/ci.sh + .claude/rules/rust.md ("Run cargo
      # clippy --workspace and cargo fmt --check before committing").
      - name: cargo clippy -p revvault-core -p revvault-cli -- -D warnings
        run: cargo clippy -p revvault-core -p revvault-cli --all-targets -- -D warnings

  frontend-build:
    name: pnpm build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: pnpm build
        run: pnpm build
        working-directory: frontend

  frontend-test:
    name: pnpm test (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: pnpm test
        run: pnpm test
        working-directory: frontend

  shellcheck:
    name: ShellCheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning

  no-hardcoded-user:
    name: anti-regression — no hardcoded "joshu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Grep for hardcoded "joshu" in scripted files
        run: |
          set -euo pipefail
          # Universal anti-regression guard mirrored from revkit#5 / forge#6
          # / revcon#2. revvault scripts/ + crates/cli touch developer
          # environments — a hardcoded user-account path would propagate
          # into operator workflows. Limited to scripted file types so this
          # workflow file (which has to mention the literal patterns to
          # scan for them) doesn't match itself.
          includes=(--include='*.sh' --include='*.ps1' --include='*.psm1' --include='*.psd1')
          scan_status=0
          hits=$(grep -rn 'joshu\b' "${includes[@]}" .) || scan_status=$?
          if (( scan_status > 1 )); then
            echo "::error::Hardcoded user-account scan could not complete."
            exit 1
          fi
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded user-account name found in scripted files."
            echo "$hits"
            exit 1
          fi
          scan_status=0
          mnt_hits=$(grep -rn '/mnt/c/Users/joshu' "${includes[@]}" .) || scan_status=$?
          if (( scan_status > 1 )); then
            echo "::error::Windows user-path scan could not complete."
            exit 1
          fi
          if [ -n "$mnt_hits" ]; then
            echo "::error::Hardcoded /mnt/c/Users path found in scripted files."
            echo "$mnt_hits"
            exit 1
          fi
          echo "ok — no hardcoded user paths in scripted files"

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # gitleaks CLI binary (MIT, free). The gitleaks-action wrapper requires a
      # paid license for organization accounts and fails on Dependabot PRs.
      GITLEAKS_VERSION: "8.30.0"
      # SHA256 of gitleaks_<ver>_linux_x64.tar.gz (from gitleaks_<ver>_checksums.txt);
      # verified before install to close the curl|tar supply-chain gap. Bump with VERSION.
      GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}" -o "/tmp/${tarball}"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --no-banner --redact \
            --config .gitleaks.toml \
            --report-path /tmp/gitleaks-report.json --report-format json

  test-cross-platform:
    # Cross-platform regression coverage. The primary `test` job above
    # stays ubuntu-only (and keeps the "Test (core + cli)" name) to match
    # the pre-existing branch-protection required check; this job adds
    # macOS and Windows legs without disturbing that.
    #
    # As of the memfd portability fix (closes #23), this job is REQUIRED.
    # The previous `continue-on-error: true` carve-out has been lifted.
    name: Test (core + cli) — ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo test -p revvault-core -p revvault-cli --all-targets
        run: cargo test -p revvault-core -p revvault-cli --all-targets

  msrv:
    # Verify revvault still builds on its declared minimum supported Rust
    # version. The MSRV is `rust-version = "1.88"` in the workspace
    # Cargo.toml — driven by `time`, `darling_macro`, and `instability`
    # transitive deps (ratatui-textarea claims 1.86 but our wider tree
    # pushes the floor to 1.88). Bump together when any dep raises the
    # floor; verify locally with `cargo +<msrv> build -p revvault-core
    # -p revvault-cli`.
    name: MSRV (rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.88
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo build -p revvault-core -p revvault-cli
        run: cargo build -p revvault-core -p revvault-cli

  audit:
    # cargo-audit hits the RustSec advisory database. revvault is an
    # age-encryption secret vault; shipping with a known CVE in any
    # transitive crate is unacceptable.
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
      - name: Stale-ignore guard — RUSTSEC-2026-0194/0195 (quick-xml)
        # .cargo/audit.toml carries two quick-xml ignores that are valid
        # ONLY while the fix (quick-xml >=0.41) is unreachable through
        # plist (upstream: ebarnard/rust-plist#191). The moment a plist
        # release makes it reachable, this step fails the build so the
        # ignores cannot silently outlive their justification. Then: run
        # `cargo update -p plist`, delete both ignores from
        # .cargo/audit.toml, and delete this step.
        run: |
          set -euo pipefail
          update_output="$(cargo update --dry-run -p plist 2>&1)"
          echo "$update_output"
          CARGO_UPDATE_OUTPUT="$update_output" python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          with open('Cargo.lock', 'rb') as lockfile:
              packages = tomllib.load(lockfile)['package']
          locked = [pkg['version'] for pkg in packages if pkg['name'] == 'quick-xml']
          if not locked:
              sys.exit('::error::quick-xml is absent from Cargo.lock; review the stale ignores')

          output = os.environ['CARGO_UPDATE_OUTPUT']
          updates = re.findall(r'Updating quick-xml v\S+ -> v(\d+\.\d+\.\d+)', output)
          additions = re.findall(r'Adding quick-xml v(\d+\.\d+\.\d+)', output)
          if re.search(r'(?:Updating|Adding|Removing|Downgrading) quick-xml\b', output) and not (updates or additions):
              sys.exit('::error::cannot parse quick-xml version from cargo update output')

          versions = locked + updates + additions
          print(f'quick-xml locked: {locked}; reachable: {updates + additions or "no update"}')
          for version in versions:
              major, minor, _ = map(int, version.split('.'))
              if major > 0 or minor >= 41:
                  sys.exit(f'::error::quick-xml {version} is available; remove RUSTSEC-2026-0194/0195 ignores')
          print('quick-xml >=0.41 remains unreachable; temporary ignores remain justified')
          PY

  deny:
    # cargo-deny checks: license compliance (allow-list in deny.toml),
    # banned/duplicate deps, and source-registry/git allow-lists. Pairs
    # with cargo-audit for full supply-chain hygiene.
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check

  doc:
    # cargo-doc with -D warnings catches broken intra-doc links and
    # missing doc items. Treats doc rot as a build error.
    name: cargo doc -D warnings
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: cargo doc -p revvault-core -p revvault-cli --no-deps
        run: cargo doc -p revvault-core -p revvault-cli --no-deps

  pnpm-audit:
    # pnpm audit on the frontend deps. Equivalent of cargo-audit for the
    # Node.js side. REQUIRED as of the 2026-05-01 hardening marathon
    # punch-list item #1: the four vite/picomatch advisories that
    # originally pinned this to advisory mode were resolved by bumping
    # vite 6.4.1 → 8.x (transitively pulling picomatch 4.0.3 → 4.0.4).
    # Parent agent must add this job to required_status_checks
    # (13 → 14 contexts) post-merge.
    name: pnpm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend
      - name: pnpm audit --audit-level=high
        run: pnpm audit --audit-level=high
        working-directory: frontend

  private-leak-scan:
    # Repo-wide leak scan for private filesystem paths, private repo
    # refs, and credential-shaped strings. Complements the `no-hardcoded-
    # user` GAP-116 anti-regression check (which only covers `joshu`)
    # with a 10-pattern scanner ported from the revskills devkit.
    name: Private Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Scan for private paths and credentials
        run: bash scripts/check-no-private-leaks.sh
