[package]
name = "revvault-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared vault library for Revvault — age-encrypted secret store"

[features]
native-service-tests = []

[[test]]
name = "service_provisioning_native"
required-features = ["native-service-tests"]

[dependencies]
libc = { workspace = true }
zeroize = { workspace = true }
tempfile = "3"
rust-embed = { version = "8", features = ["debug-embed", "deterministic-timestamps"] }
async-trait = "0.1.92"
age = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
fuzzy-matcher = { workspace = true }
secrecy = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand_core = { workspace = true }
fs2 = "0.4.3"
atomic-write-file = "0.3.1"

[dev-dependencies]
age = { workspace = true }
secrecy = { workspace = true }
mockito = "1"
tokio = { workspace = true }
